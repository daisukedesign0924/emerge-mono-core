name: Release Emerge Mono Core

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish (for example 1.28.2)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify stable version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ "$version" == *-* ]]; then
            echo "Only stable releases are public." >&2
            exit 1
          fi
          grep -Eq "Version:[[:space:]]+$version$" emerge-mono-core.php

      - name: Build plugin ZIP
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          mkdir -p dist/emerge-mono-core
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/emerge-mono-core/
          cd dist
          zip -qr "emerge-mono-core-$version.zip" emerge-mono-core
          shasum -a 256 "emerge-mono-core-$version.zip" > "emerge-mono-core-$version.zip.sha256"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          gh release create "v$version" dist/*.zip dist/*.sha256 --generate-notes --verify-tag
