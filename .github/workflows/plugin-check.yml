name: Plugin Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '.'
